<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DOGCHECK</title>
    <style>
        @font-face {
            font-family: Determination;
            src: url("asset/DeterminationMonoWebRegular-Z5oq.ttf");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            overflow: hidden;

            font-family: Determination;
        }

        #dogcheck {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #media {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #dog {
            image-rendering: pixelated;
            width: 150px;
            cursor: pointer;
        }

        #info {

            position: absolute;

            left: 50%;
            bottom: 5vh;

            transform: translateX(-50%);

            width: min(90vw, 900px);

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 12px;

        }

        #message {

            font-size: 24px;
            text-align: center;

        }

        #website,
        #errorcode {

            font-size: 18px;
            text-align: center;

        }

        .label {

            margin-bottom: 4px;

        }

        #details {
            position: absolute;

            left: 50%;
            bottom: 2vh;

            transform: translateX(-50%);

            width: min(90vw, 900px);

            text-align: center;

            font-size: 18px;
        }

    </style>
    
</head>

<body>

    <div id="dogcheck">

        <div id="media">
            
        </div>
    </div>
    <div id="info">

        <div id="message"></div>

        <div id="website"></div>

        <div id="errorcode"></div>

    </div>


    <script>
        const media = document.getElementById("media");
        const message = document.getElementById("message");
        const website = document.getElementById("website");
        const errorCode = document.getElementById("errorcode");

        const params = new URLSearchParams(window.location.search);
        const error = params.get("error") ?? params.get("code");
        const url = params.get("url");
        const customMessage = params.get("message");

        const messages = [
            "* The power of DOGCHECKS shines within you.",
            "* Despite everything, it is still you.",
            "* Unhandled exceptions are not your concern.",
            "* The dog somehow understands your code.",
            "* The dog is chewing on your CSS.",
            "* The dog says everything is under control.",
            "* The dog looks pleased.",
            "* You feel strangely determined."
        ];
        
        const errorMessages = {

            "400": "The dog doesn't understand what the browser just asked for.",
            "401": "The dog isn't allowed to enter this webpage.",
            "403": "The dog was told to stay out of this webpage.",
            "404": "The dog cannot find the webpage you were asking for.",
            "408": "The dog waited too long for the webpage to respond.",
            "409": "The dog had a FIGHT with the webpage.",
            "410": "The dog found the webpage, but it has been turned to dust.",
            "411": "The dog needs to know the size of the webpage before it can fetch it.",
            "412": "The dog was told to fetch the webpage, but it didn't meet the dog's expectations.",
            "413": "The dog cannot carry such a large webpage.",
            "414": "The dog cannot carry such a long webpage.",
            "415": "The dog cannot understand the webpage's format.",
            "416": "The dog cannot fetch the webpage's requested range.",
            "417": "The dog cannot meet the webpage's expectations.",
            "418": "The dog found out that the webpage is a teapot.",
            "429": "The dog has been asking for webpages too quickly.",
            "500": "The dog found something broken on the server.",
            "502": "The dog received a strange response from another server.",
            "503": "The dog found the server taking a nap.",
            "504": "The dog waited for another server, but it never replied."

        };

        const errorNames = {
            "400": "400 Bad Request",
            "401": "401 Unauthorized",
            "403": "403 Forbidden",
            "404": "404 Not Found",
            "405": "405 Method Not Allowed",
            "406": "406 Not Acceptable",
            "407": "407 Proxy Authentication Required",
            "408": "408 Request Timeout",
            "409": "409 Conflict",
            "410": "410 Gone",
            "411": "411 Length Required",
            "412": "412 Precondition Failed",
            "413": "413 Payload Too Large",
            "414": "414 URI Too Long",
            "415": "415 Unsupported Media Type",
            "416": "416 Range Not Satisfiable",
            "417": "417 Expectation Failed",
            "418": "418 I'm a teapot",
            "429": "429 Too Many Requests",
            "500": "500 Internal Server Error",
            "503": "503 Service Unavailable",
            "504": "504 Gateway Timeout",
            "502": "502 Bad Gateway",

        };

       const chromeErrors = {
            // DNS: the Internet's phone book has decided to become a cryptid.
            "ERR_NAME_NOT_RESOLVED":
                "The dog cannot find where the webpage lives.",
            "ERR_NAME_RESOLUTION_FAILED":
                "The dog consulted DNS and received only a cryptic bark.",
            "ERR_DOMAIN_PROBE_FINISHED_NXDOMAIN":
                "The dog checked the Internet's phone book. This domain is NOT REAL. Probably.",
            "ERR_DNS_PROBE_FINISHED_NXDOMAIN":
                "The dog dug all the way to DNS and found absolutely no domain.",
            "ERR_DNS_PROBE_FINISHED_NO_INTERNET":
                "The dog checked DNS, checked again, and discovered the Internet had left.",
            "ERR_DNS_PROBE_FINISHED_BAD_CONFIG":
                "The dog's DNS settings have achieved a new and exciting form of wrong.",
            "ERR_DNS_TIMED_OUT":
                "DNS took so long to answer that the dog has started a new life.",
            "ERR_CACHED_NAME_NOT_RESOLVED":
                "Even the cached answer has no idea where this website went.",

            // Connection: knocking on the server's door, repeatedly.
            "ERR_CONNECTION_REFUSED":
                "The dog knocked on the server's door, but nobody answered.",
            "ERR_CONNECTION_TIMED_OUT":
                "The dog waited patiently... but nobody came.",
            "ERR_CONNECTION_RESET":
                "The server slammed the door in the dog's face.",
            "ERR_CONNECTION_CLOSED":
                "The connection closed. The dog was not even allowed to say goodbye.",
            "ERR_CONNECTION_ABORTED":
                "The connection rage-quit before the dog could load the page.",
            "ERR_CONNECTION_FAILED":
                "The dog failed to establish a connection. Character development arc postponed.",
            "ERR_ADDRESS_UNREACHABLE":
                "The dog doesn't know how to reach this address.",
            "ERR_ADDRESS_INVALID":
                "The dog has determined that this address is, technically, nonsense.",
            "ERR_NETWORK_CHANGED":
                "The dog looked away for one second and the network changed universes.",
            "ERR_INTERNET_DISCONNECTED":
                "The dog can't smell the Internet anymore.",
            "ERR_NETWORK_ACCESS_DENIED":
                "The network told the dog to get off its lawn.",
            "ERR_TUNNEL_CONNECTION_FAILED":
                "The dog tried the proxy tunnel. It was, unfortunately, a tunnel-shaped problem.",
            "ERR_PROXY_CONNECTION_FAILED":
                "The proxy has ghosted the dog.",
            "ERR_EMPTY_RESPONSE":
                "The server sent the dog absolutely nothing. Not even a sympathy bark.",
            
            // TLS / certificates: trust issues, but make them cryptographic.
            "ERR_SSL_PROTOCOL_ERROR":
                "The dog got confused by the website's security certificate.",
            "ERR_SSL_VERSION_OR_CIPHER_MISMATCH":
                "The dog and server cannot agree on a cryptographic handshake. Awkward.",
            "ERR_CERT_AUTHORITY_INVALID":
                "The dog doesn't trust this certificate.",
            "ERR_CERT_COMMON_NAME_INVALID":
                "The certificate's name tag does not match the website. Suspicious dog behavior.",
            "ERR_CERT_DATE_INVALID":
                "The dog's certificate is from the past, the future, or a very bad clock.",
            "ERR_CERT_REVOKED":
                "The certificate has been revoked. The dog confiscated its tiny ID card.",
            "ERR_SSL_PINNED_KEY_NOT_IN_CERT_CHAIN":
                "The dog expected a specific key and got a whole different keychain.",
            "ERR_BAD_SSL_CLIENT_AUTH_CERT":
                "The server asked for ID. The dog presented a chew toy.",

            // Browser, file, and request chaos.
            "ERR_FILE_NOT_FOUND":
                "The dog couldn't find that file.",
            "ERR_FILE_EXISTS":
                "The dog tried to create a file, but it already exists. The file was here first.",
            "ERR_ACCESS_DENIED":
                "The dog tried to enter the file and was denied access. No treats for you.",
            "ERR_ABORTED":
                "The dog stopped looking for the webpage.",
            "ERR_BLOCKED_BY_CLIENT":
                "The dog noticed something blocked the webpage.",
            "ERR_BLOCKED_BY_ADMINISTRATOR":
                "The administrator has confiscated the dog's Internet privileges.",
            "ERR_BLOCKED_BY_RESPONSE":
                "The response blocked itself. The dog respects its commitment to the bit.",
            "ERR_TOO_MANY_REDIRECTS":
                "The dog followed redirects in a circle and is now back where it started.",
            "ERR_INVALID_URL":
                "The dog has looked at this URL and respectfully declined to parse it.",
            "ERR_DISALLOWED_URL_SCHEME":
                "The dog refuses to fetch a URL scheme that looks like it was invented at 3 AM.",
            "ERR_UNSAFE_PORT":
                "The dog found a port Chrome considers unsafe. Port 666 was not helping.",
            "ERR_INVALID_RESPONSE":
                "The server replied in a language made entirely of question marks.",
            "ERR_CONTENT_LENGTH_MISMATCH":
                "The dog counted the bytes. The server's maths does not check out.",
            "ERR_INCOMPLETE_CHUNKED_ENCODING":
                "The server sent half a chunk and called it a day.",
            "ERR_RESPONSE_HEADERS_MULTIPLE_CONTENT_LENGTH":
                "The server gave the dog two different answers about how long the response is.",
            "ERR_HTTP2_PROTOCOL_ERROR":
                "HTTP/2 has entered its experimental jazz era.",
            "ERR_HTTP2_SERVER_REFUSED_STREAM":
                "The server refused the stream. The dog will take this personally.",
            "ERR_QUIC_PROTOCOL_ERROR":
                "QUIC said 'quick' and then immediately became a debugging session.",
            "ERR_CACHE_MISS":
                "The dog checked the cache. The cache checked out.",
            "ERR_CACHE_READ_FAILURE":
                "The dog tried to read the cache, but the cache is apparently illiterate.",
            "ERR_CACHE_WRITE_FAILURE":
                "The cache refused to remember anything. Relatable.",
            "ERR_INSUFFICIENT_RESOURCES":
                "Chrome has run out of resources. The dog recommends closing 47 tabs.",
            "ERR_OUT_OF_MEMORY":
                "The browser has run out of memory. The dog would like to forget this happened.",
            // WebSocket / downloads / miscellaneous suffering.
            "ERR_WEBSOCKET_PROTOCOL_ERROR":
                "The WebSocket snapped. The dog has no idea how to knit it back together.",
            "ERR_UNSAFE_REDIRECT":
                "The dog was redirected somewhere sketchy and has chosen self-preservation.",
            "ERR_UPLOAD_FILE_CHANGED":
                "The file changed mid-upload. The dog suspects a shapeshifter.",
            "ERR_UPLOAD_FILE_REJECTED":
                "The upload was rejected. The dog is appealing to the treat tribunal.",
            "ERR_NO_SUPPORTED_PROXIES":
                "Chrome looked for a usable proxy and found a room full of unplugged boxes.",
            "ERR_FAILED":
                "Something failed. Extremely helpful, Chrome. Ten out of ten diagnostics.",
            "ERR_UNEXPECTED":
                "The dog encountered something unexpected. So did the developer.",
            "ERR_NOT_IMPLEMENTED":
                "This feature has not been implemented. The dog has filed a Jira ticket.",
            "ERR_INVALID_ARGUMENT":
                "Chrome received an argument so invalid it has requested a second opinion."

        };

        const music = [
            "asset/dogcheck.ogg",
            "asset/dogroom.ogg",
            "asset/dance_of_dog.ogg"
        ];

        const BARK = "asset/dogbark.ogg";

        const STATE = {
            DOGCHECK: "dogcheck",
            PROPHECY: "prophecy"
        };

        let currentState = STATE.DOGCHECK;
        const dog = document.createElement("img");
        dog.addEventListener("click", dogClicked);
        let bark = new Audio(BARK);
        let sleepTimer = null;
        let dogSleeping = false;
        let audio = new Audio();
        let musicStarted = false;

        const DOG_GIF = "asset/Annoying_Dog_sprite.gif";
        const SLEEP_GIF = "asset/Annoying_Dog_overworld_sleeping.gif";
        const PROPHECY_VIDEO = "asset/annoying_prophecy.mp4";
        const PROPHECY_CHANCE = 0.05;

        function randomChoice(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function setMessage(custom) {
            message.textContent = custom || randomChoice(messages);
        }
        
        function generateMessage() {

            if (customMessage)
                return customMessage;
            if (error) {
                if (errorMessages[error])
                    return "* " + errorMessages[error];

                if (chromeErrors[error])
                    return "* " + chromeErrors[error];
            }
            return randomChoice(messages);

        }

        function populateDetails() {

            if (url) {

                website.innerHTML = "";

                const label = document.createElement("div");
                label.className = "label";
                label.textContent = "Website";

                const value = document.createElement("div");
                value.textContent = decodeURIComponent(url);

                website.append(label, value);

            }

            if (error) {

                errorCode.innerHTML = "";

                const label = document.createElement("div");
                label.className = "label";
                label.textContent = "Error";

                const value = document.createElement("div");
                value.textContent = errorNames[error] || error;

                errorCode.append(label, value);

            }

        }

        function resetSleepTimer() {
            clearTimeout(sleepTimer);

            sleepTimer = setTimeout(() => {

                putDogToSleep();

            }, 30000);
        }

        function playRandomMusic() {

            audio.src = randomChoice(music);

            audio.loop = true;

            audio.volume = 0.5;

            audio.play().catch(() => {
                // Browser blocked autoplay.
            });

        }

        function startMusic() {

            if (musicStarted)
                return;

            musicStarted = true;

            playRandomMusic();

        }

        function showProphecy() {
            audio.volume = 0;
            media.innerHTML = "";

            const video = document.createElement("video");

            video.src = PROPHECY_VIDEO;

            video.autoplay = true;
            video.playsInline = true;
            video.loop = true;
            video.controls = false;

            video.style.maxWidth = "90vw";
            video.style.maxHeight = "90vh";

            media.appendChild(video);

            video.play().catch(() => {
                // Browser blocked autoplay.
            });

        }

        function showDog() {

            media.innerHTML = "";

            dog.id = "dog";
            dog.src = DOG_GIF;
            dog.alt = "Annoying Dog";

            media.appendChild(dog);

        }

        function putDogToSleep() {
            dogSleeping = true;
            dog.src = SLEEP_GIF;
        }

        function wakeDog() {
            dogSleeping = false;
            dog.src = DOG_GIF;

            resetSleepTimer();
        }

        function dogClicked() {

            bark.currentTime = 0;
            bark.playbackRate = 0.95 + Math.random() * 0.1;
            bark.play();

            if (dogSleeping)
                wakeDog();
            else
                resetSleepTimer();

        }

        function handleInteraction() {

            if (currentState === STATE.PROPHECY) {

                const video = media.querySelector("video");

                if (video)
                    video.play();

                return;
            }

            startMusic();

        }

        function initialize() {
            populateDetails();
            setMessage(generateMessage());

            if (Math.random() < PROPHECY_CHANCE){
                currentState = STATE.PROPHECY;
                showProphecy();
            } else {
                currentState = STATE.DOGCHECK;
                showDog();
            }
        }

        document.addEventListener("pointerdown", handleInteraction);
        document.addEventListener("keydown", handleInteraction);

        initialize();
    </script>

</body>
</html>
